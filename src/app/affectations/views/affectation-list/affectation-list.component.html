<loader *ngIf="isLoading"></loader>


 <div class="no-affectations-container" *ngIf="!isLoading && affectations.length === 0">
                <div class="header">
                    <h2>Liste des Affectations</h2>
                  <button class="add-button" (click)="goToAdd()">
                  ➕
                  </button>
</div>
<div class="no-affectations-message">
  <p>Aucune affectation disponible</p>
</div>
</div>

<!--  <confirm-modal></confirm-modal>-->

  <!--  {showDetailsModal && selectedAffectation && (
                  <AffectationDetails affectation={selectedAffectation} handleClose={handleCloseDetailsModal} />
              )}-->
<div class="table-container" *ngIf="!isLoading && affectations.length > 0">
  <div class="header">
    <h2>Liste des Affectations</h2>

    <button (click)="goToAdd()" class="add-button">➕</button>
  </div>

  <table class="table">
    <thead>
    <tr>
      <th>Équipement</th>
      <th>Utilisateur</th>
      <th>Date Début</th>
      <th>Date Fin</th>
      <th>Déterminé</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let a of affectations">
      <td>{{a.equipement.nom || "-"}}</td>
      <td>{{a.utilisateur.nom || "-"}}</td>
      <td>{{a.date_debut || "-"}}</td>
      <td>{{a.date_fin || "-"}}</td>
      <td>{{a.determine ? "Oui" : "Non"}}</td>
      <td>
        <div class="action-buttons">
          <button (click)="handleShow(a.id!)" class="action-button show-btn">
            <show-icon [size]="24"></show-icon>
          </button>
          <button (click)="handleUpdate(a.id!)" class="action-button edit-btn"><edit-icon></edit-icon></button>
          <button (click)="handleDelete(a.id!)" class="action-button delete-btn"><delete-icon></delete-icon></button>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
</div>
