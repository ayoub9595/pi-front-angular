<loader *ngIf="isLoading"></loader>

<confirm-modal *ngIf="showModal"
               [title]="'Attention'"
               [message]="'Voulez vous vraiment supprimer cet equipement ?'"
               (confirm)="deleteEquipement()"
               (cancel)="closeModal()"
></confirm-modal>

<equipement-details *ngIf="showInfoModal"
                    [equipment]="equipementToShow!"
                    (handleClose)="closeInfoModal()" >

</equipement-details>

<div *ngIf="equipements.length === 0 && !isLoading" class="no-equipment-container">
  <div class="header">
    <h2>Liste des Équipements</h2>
    <div>
      <button class="add-button" (click)="goToAddEquipement()">➕</button>
    </div>
  </div>
  <div class="no-equipment-message">
    <p>Aucun équipement disponible. Veuillez ajouter un.</p>
  </div>
</div>

<div *ngIf="equipements.length > 0 && !isLoading">
  <div class="header">
    <h2>Liste des Équipements</h2>
    <div>
      <button class="add-button" (click)="goToAddEquipement()">➕</button>
    </div>
  </div>

  <equipement-table [equipments]="equipements"
                    (onShowDetails)="displayModalInfo($event)"
                    (onUpdate)="goToEditEquipement($event)"
                    (onDelete)="showModalDelete($event)"
  >

  </equipement-table>

  <equipement-card [equipments]="equipements"
                    (onUpdate)="goToEditEquipement($event)"
                    (onDelete)="showModalDelete($event)"
  >

  </equipement-card>

</div>
